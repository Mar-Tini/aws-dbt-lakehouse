version: 2

sources:
  - name: ecommerce
    schema: public

    tables:
      - name: raw_orders
        description: "Raw orders data from the e-commerce platform."
        columns:
          - name: invoice_no
            description: "Unique identifier for each invoice."
          - name: stock_code
            description: "Code representing the product."
          - name: quantity
            description: "Number of items sold."
          - name: invoice_date
            description: "Date and time when the invoice was generated."
          - name: unit_price
            description: "Price per unit of the product."
          - name: country
            description: "Country where the order was placed."